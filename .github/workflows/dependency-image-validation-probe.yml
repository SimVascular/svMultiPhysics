name: Validate staged Ubuntu 26 dependency image on fork

# Temporary fork-only caller. Remove before opening the upstream PR.
on:
  push:
    branches:
      - feature/766-stage-ubuntu26-dependencies
    paths:
      - .github/workflows/dependency-image-validation-probe.yml
      - .github/workflows/dependency-image-tests.yml
      - .github/actions/ci-helpers.sh
      - release.json

permissions:
  contents: read
  packages: read

jobs:
  validate:
    if: github.repository == 'bearsontheloose/svMultiPhysics'
    uses: ./.github/workflows/dependency-image-tests.yml
    with:
      image: ghcr.io/bearsontheloose/svmultiphysics-dependencies
      digest: sha256:81f1c40daf9704899b44c52d2d956418d9c884b2f691936cc2bf450b658c74cc
      source_commit: ${{ github.sha }}
      build_type: Release
