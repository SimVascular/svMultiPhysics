[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "svbenchmark"
version = "0.1.0"
description = "Verification, validation, and benchmarking for SimVascular solvers"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pyright",
    "ruff",
    "build",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["svbenchmark*"]
namespaces = false

[tool.pyright]
typeCheckingMode = "strict"
include = ["svbenchmark"]